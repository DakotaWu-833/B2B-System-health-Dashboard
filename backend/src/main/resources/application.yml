spring:
  application:
    name: system-health-dashboard-backend
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/system_health_dashboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:dashboard_user}
    password: ${DB_PASSWORD:dashboard_password}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  redis:
    enabled: ${REDIS_ENABLED:false}
    namespace: ${REDIS_NAMESPACE:dashboard:v1:}
  rate-limit:
    ai-per-minute: ${AI_REQUESTS_PER_MINUTE:20}
    login-per-minute: ${LOGIN_REQUESTS_PER_MINUTE:10}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://127.0.0.1:11434}
    model: ${AI_MODEL:qwen3.5:9b-q4_K_M}
    embedding-model: ${AI_EMBEDDING_MODEL:}
    timeout: ${AI_TIMEOUT:PT30S}
    max-tool-calls: ${AI_MAX_TOOL_CALLS:6}
    runtime:
      context-tokens: ${AI_CONTEXT_TOKENS:8192}
      batch-size: ${AI_BATCH_SIZE:256}
      embedding-context-tokens: ${AI_EMBEDDING_CONTEXT_TOKENS:4096}
      keep-alive: ${AI_KEEP_ALIVE:PT1M}
      embedding-keep-alive: ${AI_EMBEDDING_KEEP_ALIVE:PT15S}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:no-reply@dashboard.local}
    ttl: ${EMAIL_VERIFICATION_TTL:PT15M}
    resend-after: ${EMAIL_RESEND_AFTER:PT1M}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo-accounts:
    enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    operations-username: ${DEMO_OPERATIONS_USERNAME:demo.operations}
    operations-password: ${DEMO_OPERATIONS_PASSWORD:}
    management-username: ${DEMO_MANAGEMENT_USERNAME:demo.management}
    management-password: ${DEMO_MANAGEMENT_PASSWORD:}
  metrics:
    retention:
      enabled: ${METRIC_RETENTION_ENABLED:false}
      retain-for: ${METRIC_RETAIN_FOR:P30D}
      batch-size: ${METRIC_RETENTION_BATCH_SIZE:500}
      interval-ms: ${METRIC_RETENTION_INTERVAL_MS:600000}
    stale-after: ${METRIC_STALE_AFTER:PT5M}
  demo-data:
    enabled: ${DEMO_DATA_SEED_ENABLED:false}
    live-enabled: ${DEMO_LIVE_METRICS_ENABLED:false}
    interval-ms: ${DEMO_METRIC_INTERVAL_MS:30000}
  health:
    thresholds:
      cpu-warning: ${HEALTH_CPU_WARNING_THRESHOLD:75.0}
      cpu-critical: ${HEALTH_CPU_CRITICAL_THRESHOLD:90.0}
      memory-warning: ${HEALTH_MEMORY_WARNING_THRESHOLD:75.0}
      memory-critical: ${HEALTH_MEMORY_CRITICAL_THRESHOLD:90.0}
      response-time-warning: ${HEALTH_RESPONSE_TIME_WARNING_MS:500}
      response-time-critical: ${HEALTH_RESPONSE_TIME_CRITICAL_MS:1000}
  auth:
    seed:
      enabled: ${AUTH_SEED_ENABLED:false}
      username: ${AUTH_SEED_USERNAME:}
      password: ${AUTH_SEED_PASSWORD:}
      role: ${AUTH_SEED_ROLE:OPERATIONS}
