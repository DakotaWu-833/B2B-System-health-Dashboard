spring:
  datasource:
    url: jdbc:h2:mem:system-health-dashboard;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  rate-limit:
    login-per-minute: 10000
    ai-per-minute: 10000
