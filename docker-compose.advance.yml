# Combine with docker-compose.ui.yml. Redis stays on the private Compose network.
services:
  redis:
    image: redis:8.2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy noeviction --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 2s
      retries: 20
  ollama:
    image: ollama/ollama:0.40.3
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-60s}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-8}
      LLAMA_ARG_CACHE_RAM: ${LLAMA_ARG_CACHE_RAM:-256}
    volumes:
      - advance-ollama:/root/.ollama
  backend:
    environment:
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen3.5:9b-q4_K_M}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      AI_TIMEOUT: ${AI_TIMEOUT:-PT30S}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-256}
      AI_EMBEDDING_CONTEXT_TOKENS: ${AI_EMBEDDING_CONTEXT_TOKENS:-4096}
      AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:-PT1M}
      AI_EMBEDDING_KEEP_ALIVE: ${AI_EMBEDDING_KEEP_ALIVE:-PT15S}
    depends_on:
      redis:
        condition: service_healthy
volumes:
  advance-ollama:
