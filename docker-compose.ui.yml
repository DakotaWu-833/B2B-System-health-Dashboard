# Complete local application, isolated from the normal development database.
# See docs/ui-docker.md for startup and credentials.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dashboard_ui
      MYSQL_USER: dashboard_ui
      MYSQL_PASSWORD: ${UI_DB_PASSWORD:?Set UI_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ui-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${UI_MAIL_PORT:-8561}:8025"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dashboard_ui?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: dashboard_ui
      DB_PASSWORD: ${UI_DB_PASSWORD:?Set UI_DB_PASSWORD}
      DEMO_ACCOUNTS_ENABLED: "true"
      DEMO_OPERATIONS_USERNAME: demo.operations
      DEMO_OPERATIONS_PASSWORD: ${UI_OPERATIONS_PASSWORD:?Set UI_OPERATIONS_PASSWORD}
      DEMO_MANAGEMENT_USERNAME: demo.management
      DEMO_MANAGEMENT_PASSWORD: ${UI_MANAGEMENT_PASSWORD:?Set UI_MANAGEMENT_PASSWORD}
      DEMO_DATA_SEED_ENABLED: "true"
      DEMO_LIVE_METRICS_ENABLED: "true"
      EMAIL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORS_ALLOWED_ORIGINS: http://localhost:${UI_PORT:-5619},http://127.0.0.1:${UI_PORT:-5619}
    ports:
      - "127.0.0.1:${UI_API_PORT:-15619}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${UI_PORT:-5619}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  ui-mysql-data:
