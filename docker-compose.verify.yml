# Isolated local acceptance services. Use a distinct Compose project; no project data volumes.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dashboard_verification
      MYSQL_USER: dashboard_verify
      MYSQL_PASSWORD: ${VERIFY_DB_PASSWORD:?Set VERIFY_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${VERIFY_MYSQL_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${VERIFY_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${VERIFY_MAIL_UI_PORT:-8026}:8025"
