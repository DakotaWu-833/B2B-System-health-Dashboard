<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Sprint 1 UML use-case diagram</title>
  <desc id="description">Operations Staff and Management User interact with three use cases: sign in and sign out, view system health overview, and inspect system details and recent metrics.</desc>
  <defs>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#344054" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #162B4D; }
      .boundary-label { font: 700 21px Arial, sans-serif; fill: #162B4D; }
      .actor-label { font: 600 18px Arial, sans-serif; fill: #1D2939; text-anchor: middle; }
      .usecase-id { font: 700 18px Arial, sans-serif; fill: #173F7A; text-anchor: middle; }
      .usecase-name { font: 500 20px Arial, sans-serif; fill: #1D2939; text-anchor: middle; }
      .relation-label { font: italic 16px Arial, sans-serif; fill: #344054; text-anchor: middle; }
      .association { stroke: #475467; stroke-width: 2.2; fill: none; }
      .actor { stroke: #1D2939; stroke-width: 3; fill: #FFFFFF; }
      .usecase { stroke: #2457A6; stroke-width: 2.5; fill: #F4F8FF; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="600" y="40" class="title" text-anchor="middle">Sprint 1 Use-Case Model</text>

  <rect x="250" y="70" width="700" height="610" rx="8" fill="#FCFCFD" stroke="#667085" stroke-width="2.5"/>
  <text x="600" y="106" class="boundary-label" text-anchor="middle">B2B System Health Dashboard - Sprint 1</text>

  <!-- Operations Staff actor -->
  <circle cx="110" cy="235" r="27" class="actor"/>
  <line x1="110" y1="262" x2="110" y2="343" class="actor"/>
  <line x1="58" y1="290" x2="162" y2="290" class="actor"/>
  <line x1="110" y1="343" x2="68" y2="395" class="actor"/>
  <line x1="110" y1="343" x2="152" y2="395" class="actor"/>
  <text x="110" y="425" class="actor-label">Operations Staff</text>

  <!-- Management User actor -->
  <circle cx="1090" cy="235" r="27" class="actor"/>
  <line x1="1090" y1="262" x2="1090" y2="343" class="actor"/>
  <line x1="1038" y1="290" x2="1142" y2="290" class="actor"/>
  <line x1="1090" y1="343" x2="1048" y2="395" class="actor"/>
  <line x1="1090" y1="343" x2="1132" y2="395" class="actor"/>
  <text x="1090" y="425" class="actor-label">Management User</text>

  <!-- Associations -->
  <line x1="162" y1="280" x2="380" y2="220" class="association"/>
  <line x1="162" y1="295" x2="350" y2="380" class="association"/>
  <line x1="158" y1="315" x2="375" y2="545" class="association"/>
  <line x1="1038" y1="280" x2="820" y2="220" class="association"/>
  <line x1="1038" y1="295" x2="850" y2="380" class="association"/>
  <line x1="1042" y1="315" x2="825" y2="545" class="association"/>

  <!-- Use cases -->
  <ellipse cx="600" cy="205" rx="220" ry="72" class="usecase"/>
  <text x="600" y="193" class="usecase-id">UC-01</text>
  <text x="600" y="224" class="usecase-name">Sign in and sign out</text>

  <ellipse cx="600" cy="380" rx="250" ry="75" class="usecase"/>
  <text x="600" y="368" class="usecase-id">UC-02</text>
  <text x="600" y="399" class="usecase-name">View system health overview</text>

  <ellipse cx="600" cy="560" rx="225" ry="78" class="usecase"/>
  <text x="600" y="542" class="usecase-id">UC-03</text>
  <text x="600" y="573" class="usecase-name">Inspect system details</text>
  <text x="600" y="600" class="usecase-name">and recent metrics</text>

  <!-- Extend relationship: optional detail inspection after overview -->
  <line x1="600" y1="482" x2="600" y2="457" stroke="#344054" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
  <text x="695" y="473" class="relation-label">&lt;&lt;extend&gt;&gt;</text>
</svg>
